name: Release Chart

on:
  push:
    branches: [ main ]
    paths:
      - 'helm/**'

permissions:
  contents: read

jobs:
  release-chart:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "${ACTOR}@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        env:
          CR_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          charts_dir: helm
          pages_branch: gh_pages

      - name: Update chart release notes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHART_REPO: https://n0zz.github.io/cloudflare-prometheus-exporter
        run: |
          CHART_TAG=$(gh release list --json tagName,isDraft -q '.[] | select(.tagName | startswith("cloudflare-prometheus-exporter-")) | .tagName' | head -1)
          if [ -n "$CHART_TAG" ]; then
            NOTES=$(gh release view "$CHART_TAG" --json body -q .body)
            gh release edit "$CHART_TAG" --notes "${NOTES}

          ## Install

          \`\`\`bash
          helm repo add cloudflare-exporter ${CHART_REPO}
          helm repo update
          helm install my-release cloudflare-exporter/cloudflare-prometheus-exporter
          \`\`\`

          [Chart Repository](${CHART_REPO}) | [Documentation](https://github.com/N0zz/cloudflare-prometheus-exporter)"
          fi
