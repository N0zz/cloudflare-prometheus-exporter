name: Code Quality

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: '.python-version'

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Check code formatting (ruff)
      run: uv run ruff format . --check

    - name: Run linting (ruff)
      run: uv run ruff check .

    - name: Run type checking (pyright)
      run: uv run pyright

    - name: Set up Helm
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

    - name: Validate Helm chart templates
      run: |
        helm template test helm/cloudflare-prometheus-exporter > /tmp/helm-output.yaml
        yq eval '.' /tmp/helm-output.yaml > /dev/null
        echo "Rendered resources:"
        yq eval '.kind + "/" + .metadata.name' /tmp/helm-output.yaml
