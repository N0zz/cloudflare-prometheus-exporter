name: Code Quality

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: '.python-version'

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Check code formatting (ruff)
      run: uv run ruff format . --check

    - name: Run linting (ruff)
      run: uv run ruff check .

    - name: Run type checking (pyright)
      run: uv run pyright

    - name: Set up Helm
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

    - name: Validate Helm chart templates
      run: |
        helm template test helm/cloudflare-prometheus-exporter > /tmp/helm-output.yaml
        yq eval '.' /tmp/helm-output.yaml > /dev/null
        echo "Rendered resources:"
        yq eval '.kind + "/" + .metadata.name' /tmp/helm-output.yaml
